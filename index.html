<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시티레이서 거래소</title>
    <meta name="naver-site-verification" content="e20ca4a0df269d85ef87b6278ff2c3fcb4dd229a" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #070a12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: #0d1322;
            border-radius: 24px;
            padding: 20px 16px;
            border: 1px solid #1e293b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            min-height: 90vh;
        }

        /* 상단 헤더 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            width: 36px;
            height: 36px;
            background: #0088ff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
        }

        .title-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .title {
            font-size: 17px;
            font-weight: 700;
        }

        .live-tag {
            background: #06b6d4;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .sync-time {
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
        }

        .refresh-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 검색창 */
        .search-box {
            width: 100%;
            background: #162032;
            border: 1px solid #28354d;
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
        }

        .search-box::placeholder {
            color: #64748b;
        }

        /* 상태바 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            color: #94a3b8;
        }

        .select-box {
            background: #162032;
            border: 1px solid #28354d;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
        }

        /* 매물 카드 리스트 */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            background: #131c2e;
            border: 1px solid #202d44;
            border-radius: 16px;
            padding: 14px 16px;
        }

        .item-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .seller-id {
            font-size: 12px;
            color: #94a3b8;
        }

        /* 아이템 정보 영역 (이미지 + 이름) */
        .item-middle {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .item-thumbnail {
            width: 75px;
            height: 60px;
            object-fit: contain;
            background: #0a0f1d;
            border-radius: 8px;
            border: 1px solid #1e293b;
            flex-shrink: 0;
        }

        .item-title {
            font-size: 15px;
            font-weight: 700;
            color: #f8fafc;
            word-break: break-all;
            letter-spacing: -0.3px;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-text {
            font-size: 12px;
            color: #f43f5e;
            font-weight: 600;
        }

        .price-text {
            font-size: 16px;
            font-weight: 800;
            color: #facc15;
            letter-spacing: -0.5px;
        }

        .loading {
            text-align: center;
            color: #64748b;
            padding: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 상단 헤더 -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-badge">CT</div>
                <div>
                    <div class="title-wrap">
                        <span class="title">시티레이서 거래소</span>
                        <span class="live-tag">LIVE</span>
                    </div>
                    <div class="sync-time" id="sync-time">동기화: 불러오는 중...</div>
                </div>
            </div>
            <button class="refresh-btn" onclick="fetchAndRender()">🔄 갱신</button>
        </div>

        <!-- 검색창 -->
        <input type="text" id="search-input" class="search-box" placeholder="아이템 이름 또는 판매자 검색" oninput="applyFilters()">

        <!-- 상태바 (총 개수 & 정렬) -->
        <div class="status-bar">
            <span id="total-count">총 0개 매물</span>
            <select class="select-box" id="sort-select" onchange="applyFilters()">
                <option value="default">기본순</option>
                <option value="price-asc">가격 낮은순</option>
                <option value="price-desc">가격 높은순</option>
            </select>
        </div>

        <!-- 매물 목록 -->
        <div class="item-list" id="item-list">
            <div class="loading">데이터를 불러오는 중입니다...</div>
        </div>
    </div>

    <script>
        let rawItems = [];

        async function fetchAndRender() {
            const listEl = document.getElementById('item-list');
            const syncEl = document.getElementById('sync-time');

            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                if (!res.ok) throw new Error('data.json 로드 실패');
                
                const jsonData = await res.json();
                rawItems = [];
                
                jsonData.forEach(p => {
                    if (p.items && Array.isArray(p.items)) {
                        rawItems.push(...p.items);
                    }
                });

           
                syncEl.innerText = `동기화: ${jsonData[0].timestamp}`;
                
                applyFilters();
            } catch (err) {
                console.error(err);
                listEl.innerHTML = `<div class="loading" style="color: #f43f5e;">데이터를 불러올 수 없습니다.</div>`;
            }
        }

        function applyFilters() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const sortVal = document.getElementById('sort-select').value;

            let filtered = rawItems.filter(item => {
                const nameMatch = item.name && item.name.toLowerCase().includes(query);
                const nickMatch = item.nickname && item.nickname.toLowerCase().includes(query);
                return nameMatch || nickMatch;
            });

            if (sortVal === 'price-asc') {
                filtered.sort((a, b) => parsePrice(a.price) - parsePrice(b.price));
            } else if (sortVal === 'price-desc') {
                filtered.sort((a, b) => parsePrice(b.price) - parsePrice(a.price));
            }

            document.getElementById('total-count').innerText = `총 ${filtered.length}개 매물`;
            renderList(filtered);
        }

        function parsePrice(str) {
            if (!str) return 0;
            return parseInt(str.toString().replace(/[^0-9]/g, '')) || 0;
        }

        function formatPrice(str) {
            const num = parsePrice(str);
            if (num === 0) return '-';
            return num.toLocaleString() + ' CT';
        }

        function formatTime(str) {
            if (!str) return '-';
            const numbers = str.match(/\d+/g);
            if (!numbers) return str;

            const totalHours = parseInt(numbers[0], 10);
            if (isNaN(totalHours)) return str;

            if (totalHours >= 24) {
                const days = Math.floor(totalHours / 24);
                const hours = totalHours % 24;
                return `${days}일 ${hours.toString().padStart(2, '0')}시간`;
            } else {
                return `0일 ${totalHours.toString().padStart(2, '0')}시간`;
            }
        }

        function renderList(items) {
            const listEl = document.getElementById('item-list');
            
            if (!items || items.length === 0) {
                listEl.innerHTML = `<div class="loading">등록된 매물이 없습니다.</div>`;
                return;
            }

            listEl.innerHTML = items.map(item => {
                const formattedPrice = formatPrice(item.price);
                const formattedTime = formatTime(item.time);
                const imagePath = item.image_path ? item.image_path + '?t=' + new Date().getTime() : '';

                return `
                    <div class="item-card">
                        <div class="item-card-top">
                            <span class="seller-id">ID: ${item.nickname || '알 수 없음'}</span>
                        </div>
                        <div class="item-middle">
                            <img src="${imagePath}" class="item-thumbnail" alt="아이템" onerror="this.style.display='none'">
                            <div class="item-title">${item.name || '알 수 없음'}</div>
                        </div>
                        <div class="item-footer">
                            <span class="time-text">⏱ ${formattedTime}</span>
                            <span class="price-text">${formattedPrice}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', fetchAndRender);
    </script>
</body>
</html>
