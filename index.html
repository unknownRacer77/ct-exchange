<!DOCTYPE html>
<html lang="ko">
<head>

    <!-- Chart.js 그래프 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;

        }

        body {
            background-color: #070a12;

        }

        .app-container {

        /* 뷰 전환 시스템 스타일 */

        /* 상단 네비게이션 탭 버튼 */

        /* 공통 헤더 및 검색 스타일 */

        }

        .logo-area {

            align-items: center;

        .logo-badge {

            justify-content: center;

        /* 경고 ⓘ 아이콘 및 툴팁 스타일 */
        .info-tooltip-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;

        }

        .info-icon {
            font-size: 18px;

            transition: all 0.25s ease;

        }

        /* 마우스 호버 시 주황색 글로우 효과 */
        .info-tooltip-wrap:hover .info-icon {
            color: #ff9800;
            text-shadow: 0 0 8px rgba(255, 152, 0, 0.9), 0 0 12px rgba(255, 152, 0, 0.5);
        }

        /* 경고 팝업 툴팁 */
        .info-tooltip {
            visibility: hidden;
            opacity: 0;
            width: 210px;
            background-color: #1e293b;
            color: #f8fafc;
            text-align: center;
            border-radius: 8px;
            padding: 8px 10px;

            z-index: 100;
            bottom: 130%;
            right: -10px;
            border: 1px solid #ff9800;
            font-size: 11px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: opacity 0.2s ease, visibility 0.2s ease;

        }

        .info-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            right: 14px;
            border-width: 5px;
            border-style: solid;
            border-color: #ff9800 transparent transparent transparent;
        }

        .info-tooltip-wrap:hover .info-tooltip {
            visibility: visible;

        }

        .refresh-btn {
            background: #1e293b;
            border: 1px solid #334155;

        .search-box {

            border: 1px solid #28354d;

        .status-bar {

        /* 1. 거래소 검색 화면 스타일 */

        }

        .item-card {

        }

        .item-middle {

        .item-thumbnail {

        .item-title {

            font-weight: 700;
            color: #f8fafc;

        }

        .item-footer {

        /* 2. 아이템 정보 검색 화면 스타일 */

        .info-table {
            width: 100%;

            background: #131c2e;

        .info-table th, .info-table td {

        }

        .info-table tr:hover {
            background: #1e293b;

        }

        /* 클래스 배지 */

        .class-badge.A { background: #06b6d4; color: #fff; }

            display: none;
            position: fixed;

        .tooltip-card {

        .modal-grid {

        .info-box {

        .info-box strong {

        .chart-section {

        .chart-wrapper {
            position: relative;
            height: 180px;
            width: 100%;
        }.event-badge { position: fixed; top: 20px; z-index: 9999; display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; background-color: #2a2a2a; color: #666; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
#golden-badge { left: 20px; }
#fokju-badge { right: 20px; }
.event-badge.fokju.active { background-color: #3d0000; color: #ff4d4d; border: 1px solid #ff4d4d; box-shadow: 0 0 12px rgba(255, 77, 77, 0.6); }

@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
/* 레이아웃 확장 및 바둑판 배열 */
.app-container {

<body>
    <div class="app-container">

        <!-- [VIEW 1] 거래소 검색 화면 -->
    
  <!-- 화면 양쪽 고정 뱃지 -->

        <div id="view-trade" class="view active-view">
           <div class="header">

<button class="golden-btn">골든타임</button>
<button class="frenzy-btn">폭주타임</button>

                            <span class="title">아이템 정보 DB</span>

    <!-- 상세 정보 모달 -->
    <div id="modal" onclick="if(event.target === this) closeModal()">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>

    <script>
    // --- 전역 변수 ---
    let rawItems = [];
    let priceChartInstance = null;

    let itemData = [];
    let filteredItemData = [];
    let currentItemPage = 1;
    const itemsPerPage = 20;

    let currentTradePage = 1;
    const tradeItemsPerPage = 30;
    let filteredTradeItems = [];

    // --- 탭 전환 ---
    function switchView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active-view'));
        document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));

        document.getElementById('view-' + viewId).classList.add('active-view');
        document.getElementById('tab-' + viewId).classList.add('active');

        if (viewId === 'items' && itemData.length === 0) {
            initItemDatabase();
        }
    }

    // --- 거래소 데이터 처리 ---
    async function fetchAndRenderTrade() {
        const listEl = document.getElementById('item-list');
        const syncEl = document.getElementById('sync-time');

        try {
            const res = await fetch('data.json?t=' + new Date().getTime());
            if (!res.ok) throw new Error('data.json 로드 실패');
            
            const jsonData = await res.json();
            rawItems = [];

            if (Array.isArray(jsonData)) {
                jsonData.forEach(p => {
                    if (p.items && Array.isArray(p.items)) {
                        rawItems.push(...p.items);
                    } else if (p.name || p.item_name) {
                        rawItems.push(p);
                    }
                });
                if (jsonData[0] && jsonData[0].timestamp) {
                    syncEl.innerText = `동기화: ${jsonData[0].timestamp}`;
                } else {
                    syncEl.innerText = `동기화 완료`;
                }
            }
            
            applyTradeFilters();
        } catch (err) {
            console.error(err);
            listEl.innerHTML = `<div class="loading" style="color: #f43f5e;">데이터를 불러올 수 없습니다.</div>`;
        }
    }

    function parsePrice(str) {
        if (!str) return 0;
        return parseInt(str.toString().replace(/[^0-9]/g, '')) || 0;
    }

    function applyTradeFilters() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const sortVal = document.getElementById('sort-select').value;

        filteredTradeItems = rawItems.filter(item => {
            const nameMatch = item.name && item.name.toLowerCase().includes(query);
            const nickMatch = item.nickname && item.nickname.toLowerCase().includes(query);
            return nameMatch || nickMatch;
        });

        if (sortVal === 'price-asc') {
            filteredTradeItems.sort((a, b) => parsePrice(a.price) - parsePrice(b.price));
        } else if (sortVal === 'price-desc') {
            filteredTradeItems.sort((a, b) => parsePrice(b.price) - parsePrice(a.price));
        }

        document.getElementById('total-count').innerText = `총 ${filteredTradeItems.length}개 매물`;
        currentTradePage = 1;
        renderTradeList();
    }

    function renderTradeList() {
        const listEl = document.getElementById('item-list');
        if (!filteredTradeItems || filteredTradeItems.length === 0) {
            listEl.innerHTML = `<div class="loading">등록된 매물이 없습니다.</div>`;
            document.getElementById('trade-pagination').innerHTML = '';
            return;
        }

        const start = (currentTradePage - 1) * tradeItemsPerPage;
        const pageItems = filteredTradeItems.slice(start, start + tradeItemsPerPage);

        listEl.innerHTML = pageItems.map(item => {
            const priceStr = parsePrice(item.price) > 0 ? parsePrice(item.price).toLocaleString() + ' CT' : '-';
            const imagePath = item.image_path ? item.image_path + '?t=' + new Date().getTime() : '';
            const safeName = (item.name || '').replace(/'/g, "\\'");

            return `
                <div class="item-card" onclick="openTradeItemModal('${safeName}')">
                    <div class="item-middle">
                        <img src="${imagePath}" class="item-thumbnail" alt="아이템" onerror="this.style.display='none'">
                        <div class="item-title">${item.name || '알 수 없음'}</div>
                    </div>
                    <div class="item-footer">
                        <span class="time-text">⏱ ${item.time || '-'}</span>
                        <span class="price-text">${priceStr}</span>
                    </div>
                </div>
            `;
        }).join('');

        renderTradePagination(filteredTradeItems.length);
    }


function renderTradePagination(totalItems) {
    const container = document.getElementById('trade-pagination');
    if (!container) return;
    container.innerHTML = '';
    const pageCount = Math.ceil(totalItems / tradeItemsPerPage);
    if (pageCount <= 1) return;

        const maxVisible = 5;
        let start = Math.max(1, currentTradePage - Math.floor(maxVisible / 2));
        let end = Math.min(pageCount, start + maxVisible - 1);
        if (end - start + 1 < maxVisible) {
            start = Math.max(1, end - maxVisible + 1);
        }

        if (currentTradePage > 1) {
            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.innerText = '◀';
            prevBtn.onclick = () => { currentTradePage--; renderTradeList(); window.scrollTo(0, 0); };
            container.appendChild(prevBtn);
        }

        for (let i = start; i <= end; i++) {
            const btn = document.createElement('button');
            btn.className = `page-btn ${i === currentTradePage ? 'active' : ''}`;
            btn.innerText = i;
            btn.onclick = () => {
                currentTradePage = i;
                renderTradeList();
                window.scrollTo(0, 0);
            };
            container.appendChild(btn);
        }

        if (currentTradePage < pageCount) {
            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.innerText = '▶';
            nextBtn.onclick = () => { currentTradePage++; renderTradeList(); window.scrollTo(0, 0); };
            container.appendChild(nextBtn);
        }
    }

    // --- 거래소 모달 & 차트 ---
    function openTradeItemModal(itemName) {
        const body = document.getElementById('modal-body');
        const sameItems = rawItems.filter(i => i.name === itemName);
        const prices = sameItems.map(i => parsePrice(i.price)).filter(p => p > 0);
        
        let minP = 0, maxP = 0, medP = 0;
        if (prices.length > 0) {
            minP = Math.min(...prices);
            maxP = Math.max(...prices);
            const sorted = [...prices].sort((a,b) => a - b);
            const mid = Math.floor(sorted.length / 2);
            medP = sorted.length % 2 !== 0 ? sorted[mid] : Math.round((sorted[mid - 1] + sorted[mid]) / 2);
        }

        const imgPath = sameItems[0]?.image_path ? sameItems[0].image_path + '?t=' + new Date().getTime() : '';

        let html = `
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                <img src="${imgPath}" width="48" height="48" onerror="this.style.display='none'" style="border:1px solid #28354d; border-radius:8px; padding:2px; background:#0a0f1d; object-fit:contain;">
                <div>
                    <div style="font-size:16px; font-weight:bold; color:#fff;">${itemName}</div>
                    <div style="font-size:11px; color:#64748b; margin-top:2px;">실시간 거래소 시세 분석</div>
                </div>
            </div>

            <div class="modal-grid">
                <div class="info-box"><span>매물 수량</span><strong>${sameItems.length}개</strong></div>
                <div class="info-box"><span>최저가</span><strong>${minP > 0 ? minP.toLocaleString() + ' CT' : '-'}</strong></div>
                <div class="info-box"><span>중앙값</span><strong>${medP > 0 ? medP.toLocaleString() + ' CT' : '-'}</strong></div>
                <div class="info-box"><span>최고가</span><strong>${maxP > 0 ? maxP.toLocaleString() + ' CT' : '-'}</strong></div>
            </div>

            <div class="chart-section">
                <h4>📈 등록 매물 가격 분포</h4>
                <div class="chart-wrapper">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>
        `;

        body.innerHTML = html;
        document.getElementById('modal').style.display = 'flex';

        setTimeout(() => {
            renderPriceChart(prices);
        }, 50);
    }

    function renderPriceChart(prices) {
        const ctx = document.getElementById('priceChart');
        if (!ctx) return;
        
        if (priceChartInstance) {
            priceChartInstance.destroy();
            priceChartInstance = null;
        }

        const sortedPrices = [...prices].sort((a,b) => a - b);
        const chartLabels = sortedPrices.map((_, idx) => `매물 ${idx + 1}`);

        priceChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: chartLabels.length > 0 ? chartLabels : ['매물 없음'],
                datasets: [{
                    label: '가격 (CT)',
                    data: sortedPrices.length > 0 ? sortedPrices : [0],
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.15)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 4,
                    pointBackgroundColor: '#facc15'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { display: false } },
                    y: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#1e293b' } }
                }
            }
        });
    }

    // --- 아이템 DB 처리 ---
    async function initItemDatabase() {
        try {
            const res = await fetch('ctr_items_db.json?t=' + new Date().getTime());
            itemData = await res.json();
            filteredItemData = itemData;
            initDropdowns(itemData);
            filterItemTable();
        } catch (err) {
            console.error(err);
            document.getElementById('item-db-list').innerHTML = `<tr><td colspan="6" class="loading" style="color: #f43f5e;">DB 로드 실패</td></tr>`;
        }
    }

    function getItemClass(item) {
        return String(item.carclass || item.class || '').trim().toUpperCase();
    }

    function getItemTp(item) {
        if (item.tp !== undefined && item.tp !== null && item.tp !== '') return item.tp;
        if (item.details) {
            for (let [k, v] of Object.entries(item.details)) {
                if (k.toUpperCase().includes('TP')) return v;
            }
        }
        return '-';
    }

    function getClassBadgeHtml(cls) {
        if (!cls) return '-';
        return ['C', 'B', 'A', 'S', 'G', 'R'].includes(cls) ? `<span class="class-badge ${cls}">${cls}</span>` : cls;
    }

    function initDropdowns(data) {
        const classSet = [...new Set(data.map(i => getItemClass(i)))].filter(Boolean).sort();
        const partsSet = [...new Set(data.map(i => i.parts))].filter(Boolean).sort();
        const shopSet = [...new Set(data.map(i => i.shopgroup))].filter(Boolean).sort();

        const cSel = document.getElementById('filter-class');
        const pSel = document.getElementById('filter-parts');
        const sSel = document.getElementById('filter-shop');

        cSel.innerHTML = '<option value="">전체 Class</option>';
        pSel.innerHTML = '<option value="">전체 파츠</option>';
        sSel.innerHTML = '<option value="">전체 상점</option>';

        classSet.forEach(c => cSel.innerHTML += `<option value="${c}">Class ${c}</option>`);
        partsSet.forEach(p => pSel.innerHTML += `<option value="${p}">${p}</option>`);
        shopSet.forEach(s => sSel.innerHTML += `<option value="${s}">${s}</option>`);
    }

    function filterItemTable() {
        const keyword = document.getElementById('item-search').value.toLowerCase();
        const sc = document.getElementById('filter-class').value;
        const sp = document.getElementById('filter-parts').value;
        const ss = document.getElementById('filter-shop').value;

        filteredItemData = itemData.filter(item => {
            return item.name.toLowerCase().includes(keyword) &&
                   (!sc || getItemClass(item) === sc) &&
                   (!sp || item.parts === sp) &&
                   (!ss || item.shopgroup === ss);
        });
        currentItemPage = 1;
        renderItemTable(filteredItemData);
    }

    function renderItemTable(data) {
        const tbody = document.getElementById('item-db-list');
        tbody.innerHTML = '';
        
        const start = (currentItemPage - 1) * itemsPerPage;
        const pageData = data.slice(start, start + itemsPerPage);

        if (pageData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="loading">검색 결과가 없습니다.</td></tr>`;
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        pageData.forEach(item => {
            const cls = getItemClass(item);
            const tr = document.createElement('tr');
            tr.onclick = () => showModal(item);
            tr.innerHTML = `
                <td><img src="https://ctr.domi.kr${item.image}" width="28" height="28" onerror="this.style.display='none'"></td>
                <td style="text-align:left; padding-left:10px; font-weight:600;">${item.name}</td>
                <td>${item.parts || '-'}</td>
                <td>${getClassBadgeHtml(cls)}</td>
                <td>${getItemTp(item)}</td>
                <td>${item.price || '-'}</td>
            `;
            tbody.appendChild(tr);
        });
        renderItemPagination(data.length);
    }

    function renderItemPagination(totalItems) {
        const container = document.getElementById('pagination');
        container.innerHTML = '';
        const pageCount = Math.ceil(totalItems / itemsPerPage);
        if (pageCount <= 1) return;

        const maxVisible = 5;
        let start = Math.max(1, currentItemPage - Math.floor(maxVisible / 2));
        let end = Math.min(pageCount, start + maxVisible - 1);
        if (end - start + 1 < maxVisible) {
            start = Math.max(1, end - maxVisible + 1);
        }

        if (currentItemPage > 1) {
            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.innerText = '◀';
            prevBtn.onclick = () => { currentItemPage--; renderItemTable(filteredItemData); };
            container.appendChild(prevBtn);
        }

        for (let i = start; i <= end; i++) {
            const btn = document.createElement('button');
            btn.className = `page-btn ${i === currentItemPage ? 'active' : ''}`;
            btn.innerText = i;
            btn.onclick = () => {
                currentItemPage = i;
                renderItemTable(filteredItemData);
            };
            container.appendChild(btn);
        }

        if (currentItemPage < pageCount) {
            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.innerText = '▶';
            nextBtn.onclick = () => { currentItemPage++; renderItemTable(filteredItemData); };
            container.appendChild(nextBtn);
        }
    }

    function showModal(item) {
        const body = document.getElementById('modal-body');
        const cls = getItemClass(item);
        const tpVal = getItemTp(item);

        let html = `
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                <img src="https://ctr.domi.kr${item.image}" width="42" height="42" onerror="this.style.display='none'" style="border:1px solid #28354d; border-radius:6px; padding:2px; background:#0a0f1d;">
                <div style="font-size:15px; font-weight:bold; color:#fff;">${item.name}</div>
            </div>
            <div class="tooltip-card">
                <div style="font-size:13px; font-weight:bold; color:#fff; margin-bottom:4px;">${item.name}</div>
                <div class="stat-green">장착위치 ${item.parts || ''}</div>
        `;

        if (item.details) {
            for (let [k, v] of Object.entries(item.details)) {
                const strV = String(v);
                if (strV.startsWith('+')) html += `<div class="stat-green">${k}${strV}</div>`;
                else if (strV.startsWith('-')) html += `<div class="stat-red">${k}${strV}</div>`;
            }
        }
        if (tpVal !== '-') html += `<div class="stat-yellow" style="margin-top:2px;">요구 TP ${tpVal}</div>`;
        if (item.description) html += `<div style="margin-top:6px; color:#9ca3af; font-size:11px; border-top:1px solid #28354d; padding-top:4px;">${item.description}</div>`;
        html += `</div><table class="info-table" style="font-size:12px;"><tr><th>상세 정보</th><th>값</th></tr>`;

        const baseInfo = [
            ['가격', item.price],
            ['적용차량', getClassBadgeHtml(cls)],
            ['상점그룹', item.shopgroup],
            ['거래소 분류', item.parts]
        ];
        baseInfo.forEach(([k, v]) => { if (v) html += `<tr><td>${k}</td><td>${v}</td></tr>`; });

        if (item.details) {
            for (let [k, v] of Object.entries(item.details)) {
                let styleClass = String(v).startsWith('+') ? 'class="stat-green"' : String(v).startsWith('-') ? 'class="stat-red"' : '';
                html += `<tr><td>${k}</td><td ${styleClass}>${v}</td></tr>`;
            }
        }
        html += `</table>`;
        body.innerHTML = html;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
        if (priceChartInstance) {
            priceChartInstance.destroy();
            priceChartInstance = null;
        }
        document.getElementById('modal').style.display = 'none';
    }

    // --- 초기 실행 ---
    document.addEventListener('DOMContentLoaded', fetchAndRenderTrade);
    document.getElementById('golden-badge')?.classList.add('active');
document.getElementById('fokju-badge')?.classList.add('active');
</script>
