<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시티레이서 거래소</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #070a12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: #0d1322;
            border-radius: 24px;
            padding: 20px 16px;
            border: 1px solid #1e293b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            min-height: 90vh;
        }

        /* 상단 헤더 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            width: 36px;
            height: 36px;
            background: #0088ff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
        }

        .title-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .title {
            font-size: 17px;
            font-weight: 700;
        }

        .live-tag {
            background: #06b6d4;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .sync-time {
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
        }

        .refresh-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 검색창 */
        .search-box {
            width: 100%;
            background: #162032;
            border: 1px solid #28354d;
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
        }

        .search-box::placeholder {
            color: #64748b;
        }

        /* 클래스 필터 헤더 */
        .class-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            color: #94a3b8;
        }

        .class-filters {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 16px;
            padding-bottom: 4px;
        }

        .class-btn {
            background: #162032;
            border: 1px solid #28354d;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .class-btn.active {
            background: #06b6d4;
            color: #000;
            border-color: #06b6d4;
        }

        /* 정렬 선택바 */
        .control-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }

        .select-box {
            background: #162032;
            border: 1px solid #28354d;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
        }

        /* 매물 카드 리스트 */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            background: #131c2e;
            border: 1px solid #202d44;
            border-radius: 16px;
            padding: 16px;
        }

        .item-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .item-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .class-badge {
            background: #202d44;
            color: #38bdf8;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .seller-id {
            font-size: 12px;
            color: #94a3b8;
        }

        .item-title {
            font-size: 15px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 12px;
            word-break: break-all;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-text {
            font-size: 12px;
            color: #f43f5e;
            font-weight: 600;
        }

        .price-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .price-text {
            font-size: 16px;
            font-weight: 800;
            color: #facc15;
        }

        .detail-btn {
            background: #202d44;
            border: none;
            color: #38bdf8;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            color: #64748b;
            padding: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 상단 헤더 -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-badge">CT</div>
                <div>
                    <div class="title-wrap">
                        <span class="title">시티레이서 거래소</span>
                        <span class="live-tag">LIVE</span>
                    </div>
                    <div class="sync-time" id="sync-time">동기화: 불러오는 중...</div>
                </div>
            </div>
            <button class="refresh-btn" onclick="fetchAndRender()">🔄 갱신</button>
        </div>

        <!-- 검색창 -->
        <input type="text" id="search-input" class="search-box" placeholder="아이템 이름 또는 판매자 검색 (예: 듀랄루민, FA엔진)" oninput="applyFilters()">

        <!-- 클래스 필터 헤더 -->
        <div class="class-header">
            <span>클래스 구분</span>
            <span id="total-count">총 0개 매물</span>
        </div>

        <!-- 클래스 필터 버튼 -->
        <div class="class-filters">
            <button class="class-btn active" onclick="filterClass('전체', this)">전체</button>
            <button class="class-btn" onclick="filterClass('G클래스', this)">G클래스</button>
            <button class="class-btn" onclick="filterClass('S클래스', this)">S클래스</button>
            <button class="class-btn" onclick="filterClass('A클래스', this)">A클래스</button>
            <button class="class-btn" onclick="filterClass('B클래스', this)">B클래스</button>
            <button class="class-btn" onclick="filterClass('C클래스', this)">C클래스</button>
        </div>

        <!-- 정렬 컨트롤 -->
        <div class="control-bar">
            <select class="select-box" id="sort-select" onchange="applyFilters()">
                <option value="time">남은시간 임박순</option>
                <option value="price-asc">가격 낮은순</option>
                <option value="price-desc">가격 높은순</option>
            </select>
        </div>

        <!-- 매물 목록 -->
        <div class="item-list" id="item-list">
            <div class="loading">데이터를 불러오는 중입니다...</div>
        </div>
    </div>

    <script>
        let rawItems = [];
        let selectedClass = '전체';

        // 1. 데이터 로드 및 렌더링
        async function fetchAndRender() {
            const listEl = document.getElementById('item-list');
            const syncEl = document.getElementById('sync-time');

            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                if (!res.ok) throw new Error('data.json 로드 실패');
                
                const jsonData = await res.json();
                rawItems = [];
                
                jsonData.forEach(p => {
                    if (p.items && Array.isArray(p.items)) {
                        rawItems.push(...p.items);
                    }
                });

                const now = new Date();
                syncEl.innerText = `동기화: ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
                
                applyFilters();
            } catch (err) {
                console.error(err);
                listEl.innerHTML = `<div class="loading" style="color: #f43f5e;">데이터를 불러올 수 없습니다.<br>(data.json 확인 필요)</div>`;
            }
        }

        // 2. 검색, 클래스, 정렬 필터 적용
        function applyFilters() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const sortVal = document.getElementById('sort-select').value;

            let filtered = rawItems.filter(item => {
                const nameMatch = item.name && item.name.toLowerCase().includes(query);
                const nickMatch = item.nickname && item.nickname.toLowerCase().includes(query);
                const classMatch = selectedClass === '전체' || (item.name && item.name.includes(selectedClass));
                return (nameMatch || nickMatch) && classMatch;
            });

            // 정렬
            if (sortVal === 'price-asc') {
                filtered.sort((a, b) => parsePrice(a.price) - parsePrice(b.price));
            } else if (sortVal === 'price-desc') {
                filtered.sort((a, b) => parsePrice(b.price) - parsePrice(a.price));
            }

            document.getElementById('total-count').innerText = `총 ${filtered.length}개 매물`;
            renderList(filtered);
        }

        // 금액 정수 변환
        function parsePrice(str) {
            if (!str) return 0;
            return parseInt(str.toString().replace(/[^0-9]/g, '')) || 0;
        }

        // 천단위 콤마 보정 포맷터
        function formatPrice(str) {
            const num = parsePrice(str);
            if (num === 0) return '-';
            return num.toLocaleString() + ' CT';
        }

        function filterClass(cls, btn) {
            selectedClass = cls;
            document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        }

        // 3. 아이템 리스트 HTML 생성
        function renderList(items) {
            const listEl = document.getElementById('item-list');
            
            if (!items || items.length === 0) {
                listEl.innerHTML = `<div class="loading">등록된 매물이 없습니다.</div>`;
                return;
            }

            listEl.innerHTML = items.map(item => {
                const clsName = getClassName(item.name);
                const formattedPrice = formatPrice(item.price);
                return `
                    <div class="item-card">
                        <div class="item-card-top">
                            <div class="item-meta">
                                <span class="class-badge">${clsName}</span>
                                <span class="seller-id">ID: ${item.nickname || '알 수 없음'}</span>
                            </div>
                        </div>
                        <div class="item-title">${item.name || '알 수 없음'}</div>
                        <div class="item-footer">
                            <span class="time-text">⏱ ${item.time || '-'}</span>
                            <div class="price-area">
                                <span class="price-text">${formattedPrice}</span>
                                <button class="detail-btn">상세</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getClassName(name) {
            if (!name) return 'ALL클래스';
            if (name.includes('G클래스')) return 'G클래스';
            if (name.includes('S클래스')) return 'S클래스';
            if (name.includes('A클래스')) return 'A클래스';
            if (name.includes('B클래스')) return 'B클래스';
            if (name.includes('C클래스')) return 'C클래스';
            return 'ALL클래스';
        }

        document.addEventListener('DOMContentLoaded', fetchAndRender);
    </script>
</body>
</html>
